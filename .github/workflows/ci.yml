
name: "OsTech in Github Actions"

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION_NETLIFY: "24.21.0"

jobs:
  api:
    name: "Restore, build e test da API"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: ostech_test
          MYSQL_USER: ostech
          MYSQL_PASSWORD: ostech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: "Verificar SDK selecionado"
        run: dotnet --version

      - name: "Verificar SDK .NET"
        run: dotnet --info

      - name: "Restaurar dependências"
        run: dotnet restore OSTech.slnx

      - name: "Compilar solução"
        run: dotnet build OSTech.slnx --no-restore

      - name: "Instalar ferramentas EF Core"
        run: dotnet tool install --global dotnet-ef --version 9.0.0

      - name: "Aplicar migrations no MySQL de teste"
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=ostech_test;User=ostech;Password=ostech_test;"
          JWT__SecretKey: "ci-only-test-key-not-for-production-123456789"
        run: |
          dotnet ef database update \
            --project OSTech.EFCore/OSTech.Infrastructure.csproj \
            --startup-project OSTech.WebAPI/OSTech.WebAPI.csproj
      - name: "Executar testes com filtro"
        run: dotnet test OSTech.slnx --no-build --no-restore --filter "FullyQualifiedName~UnitTests.Domain"

  frontend:
    name: "Build do frontend React"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ostechreact

    env:
      REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL_CI }}

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_NETLIFY }}

      - name: "Instalar dependências"
        run: npm ci

      - name: "Compilar frontend"
        run: npm run build

  docker:
    name: "Build das imagens do Docker"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Construir imagens da API"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ostech-api:latest

      - name: "Construir imagens do frotend"
        uses: docker/build-push-action@v6
        with:
          context: ./ostechreact
          file: ./ostechreact/Dockerfile
          push: false
          tags: ostech-frontend:latest
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL_CI }}